plugins {
	id 'fabric-loom' version '1.18-SNAPSHOT'
}

version = "${mod_version}+${minecraft_version}"

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	// Delegates to jdk.crac on a CRaC JDK; on any other JDK checkpoints just fail
	implementation include("org.crac:crac:${crac_version}")
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
